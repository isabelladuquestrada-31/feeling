<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <!--
    PROYECTO: Feeling
    ARCHIVO: sidebar.html
    UBICACIÓN: src/main/resources/templates/fragments/sidebar.html
    MÓDULO: Plantilla base, menú lateral

    AUTOR: Yulipaola Domínguez
    VERSIÓN: 1.1.0
    FECHA DE DOCUMENTACIÓN: 2026-11-24
    ESTADO: Finalizado
    TICKET: SCRUM-43

    DESCRIPCIÓN:
    Fragmento de Thymeleaf con el menú lateral de las páginas internas.
    Muestra el logo de Feeling, la información del usuario, las
    opciones de navegación según su rol (estudiante o administrador) y
    el logo de la Universidad Autónoma de Manizales. Lo incluye
    layouts/layout-interno.html con la expresión
    ~{fragments/sidebar :: sidebar}.

    FUNCIONALIDADES:
    - Dos estados en pantallas grandes: compacto (solo iconos) y
      expandido, con un botón para alternarlos.
    - En celulares y tabletas se abre como panel deslizable, con un
      fondo para cerrarlo.
    - Resalta la opción de la página actual.
    - Opciones distintas para estudiantes y administradores.

    ESTRUCTURA:
    - Fondo para cerrar el menú en móviles.
    - Menú lateral (aside): logos y botones, línea divisora, información
      del usuario, navegación e información institucional.

    TECNOLOGÍAS:
    - HTML5: estructura semántica y accesibilidad (ARIA).
    - Thymeleaf: fragmento, condicionales, rutas y textos.
    - SVG en línea: iconos que heredan el color del texto.
    - CSS3 y JavaScript: estilos y comportamiento del menú.

    DEPENDENCIAS:
    - /css/global.css y /css/interno.css.
    - /js/sidebar.js: abre, cierra y alterna el menú.

    DATOS DEL MODELO (suministrados por el controlador):
    - usuarioNombre: nombre del usuario. Si no llega, se muestra
      Estudiante.
    - usuarioRol: rol del usuario (por ejemplo, Administrador). Si no
      llega, se muestra Estudiante.
    - paginaActiva: identifica la opción que debe resaltarse. Valores:
      inicio, voluntarios, acompanamientos, ser-voluntario, usuarios y
      perfil.

    RUTAS DE LA APLICACIÓN UTILIZADAS:
    - /inicio, /voluntarios, /mis-acompanamientos, /ser-voluntario,
      /perfil y /admin/usuarios.

    ATRIBUTOS DE INTERACCIÓN:
    - data-sidebar-toggle: botón que expande o contrae el menú.
    - data-sidebar-open y data-sidebar-close: botones que abren y cierran
      el menú en móviles.
    - data-tooltip: nombre de la opción que se muestra en modo compacto.
    - aria-current: marca la página actual para lectores de pantalla.

    ATRIBUTOS src Y th:src:
    Cada imagen tiene src con ruta relativa y th:src con ruta del
    servidor. El primero permite ver este archivo abierto directamente
    en el navegador; el segundo es el que se usa en la aplicación.

    HISTORIAL DE VERSIONES:
    - 1.0.0: implementación inicial del menú (SCRUM-43).
    - 1.1.0 (2026-11-24): documentación completa. No se modificó el
      código. El cambio del fondo del menú a color liso se hizo en
      interno.css.

    OBSERVACIONES:
    - El nombre que muestra el menú depende de que el controlador envíe
      usuarioNombre; si una página no lo envía, aparece Estudiante.
    - El botón de prueba que está fuera del fragmento solo se ve al
      abrir este archivo directamente. No se incluye en la aplicación.
    -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feeling</title>

    <link rel="stylesheet" href="../../static/css/global.css">
    <link rel="stylesheet" href="../../static/css/interno.css">

    <script src="../../static/js/sidebar.js" defer></script>
</head>

<body>

    <!-- BOTÓN TEMPORAL DE PRUEBA: solo se ve al abrir este archivo
         directamente en el navegador. No forma parte del fragmento. El botón
         que se usa en la aplicación está en header.html. -->
    <button type="button"
            class="sidebar-mobile-open"
            data-sidebar-open
            aria-controls="main-sidebar"
            aria-expanded="false"
            aria-label="Abrir menú de navegación">

        <span aria-hidden="true">☰</span>

    </button>

    <!-- Fragmento reutilizable del menú lateral (nombre: sidebar). -->
    <th:block th:fragment="sidebar">

        <!-- FONDO PARA CERRAR EL MENÚ EN MÓVILES: al tocarlo, sidebar.js
             cierra el panel. -->
        <button type="button"
                class="sidebar-backdrop"
                data-sidebar-close
                aria-label="Cerrar menú de navegación">
        </button>

        <!-- MENÚ LATERAL: nace en estado compacto (clase de estado compacto).
             sidebar.js lo cambia a expandido o lo abre en móviles. -->
        <aside class="sidebar sidebar--collapsed"
               id="main-sidebar"
               aria-label="Menú principal">

            <!-- CABECERA Y LOGOS: enlace al inicio y botones de expandir y cerrar. -->
            <div class="sidebar__brand">

                <a href="/inicio"
                   th:href="@{/inicio}"
                   class="sidebar__brand-link"
                   aria-label="Feeling, ir al inicio">

                    <!-- LOGO COMPLETO: se muestra cuando el menú está expandido. -->
                    <img src="../../static/img/Logosímbolo_Sin_Fondo.png"
                         th:src="@{/img/Logosímbolo_Sin_Fondo.png}"
                         alt="Feeling, juntos es más fácil"
                         class="sidebar__logo sidebar__logo--expanded">

                    <!-- ISOTIPO: se muestra cuando el menú está compacto. -->
                    <img src="../../static/img/Isotipo.png"
                         th:src="@{/img/Isotipo.png}"
                         alt="Feeling"
                         class="sidebar__logo sidebar__logo--compact">

                </a>

                <!-- BOTÓN PARA EXPANDIR Y CONTRAER: aria-expanded y el texto accesible
                     los actualiza sidebar.js. -->
                <button type="button"
                        class="sidebar__toggle"
                        data-sidebar-toggle
                        aria-controls="main-sidebar"
                        aria-expanded="false"
                        aria-label="Expandir menú"
                        title="Expandir menú">

                    <svg class="sidebar__toggle-icon"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         aria-hidden="true">

                        <path d="m9 18 6-6-6-6"/>

                    </svg>

                </button>

                <!-- BOTÓN DE CIERRE: solo se ve en celulares y tabletas. -->
                <button type="button"
                        class="sidebar__close"
                        data-sidebar-close
                        aria-label="Cerrar menú">

                    <span aria-hidden="true">&times;</span>

                </button>

            </div>

            <!-- LÍNEA DIVISORA entre la cabecera y la información del usuario. -->
            <hr class="sidebar__divider">

            <!-- INFORMACIÓN DEL USUARIO: foto, nombre y rol. El nombre y el rol
                 vienen del modelo (usuarioNombre y usuarioRol). -->
            <section class="sidebar__user"
                     aria-label="Información del usuario">

                <img src="../../static/img/Foto_Perfil.jpg"
                     th:src="@{/img/Foto_Perfil.jpg}"
                     alt="Fotografía de perfil"
                     class="sidebar__avatar">

                <div class="sidebar__user-info">

                    <strong class="sidebar__user-name"
                            th:text="${usuarioNombre != null ? usuarioNombre : 'Estudiante'}">
                        Estudiante
                    </strong>

                    <span class="sidebar__user-role"
                          th:text="${usuarioRol != null ? usuarioRol : 'Estudiante'}">
                        Estudiante
                    </span>

                </div>

            </section>

            <!-- NAVEGACIÓN PRINCIPAL: enlaces del menú. La opción de la página
                 actual recibe una clase de resaltado y aria-current. -->
            <nav class="sidebar__navigation"
                 aria-label="Secciones de Feeling">

                <p class="sidebar__section-title">
                    MENÚ PRINCIPAL
                </p>

                <!-- INICIO: disponible para todos los roles. -->
                <a href="/inicio"
                   th:href="@{/inicio}"
                   class="sidebar__link"
                   data-tooltip="Inicio"
                   title="Inicio"
                   th:classappend="${paginaActiva == 'inicio'} ? ' sidebar__link--active' : ''"
                   th:attr="aria-current=${paginaActiva == 'inicio' ? 'page' : null}">

                    <svg class="sidebar__icon"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         aria-hidden="true">

                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"
                              fill="currentColor"
                              stroke="none"/>

                    </svg>

                    <span class="sidebar__link-label">Inicio</span>

                </a>

                <!-- OPCIONES DEL ESTUDIANTE: no se muestran al administrador, que
                     tiene las suyas más abajo. -->
                <th:block th:unless="${usuarioRol == 'Administrador'}">

                <!-- BUSCAR VOLUNTARIOS: abre la búsqueda de voluntarios. -->
                <a href="/voluntarios"
                   th:href="@{/voluntarios}"
                   class="sidebar__link"
                   data-tooltip="Buscar voluntarios"
                   title="Buscar voluntarios"
                   th:classappend="${paginaActiva == 'voluntarios'} ? ' sidebar__link--active' : ''"
                   th:attr="aria-current=${paginaActiva == 'voluntarios' ? 'page' : null}">

                    <svg class="sidebar__icon"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         aria-hidden="true">

                        <circle cx="10.5" cy="10.5" r="6.5"/>
                        <path d="m16 16 5 5"/>

                    </svg>

                    <span class="sidebar__link-label">Buscar voluntarios</span>

                </a>

                <!-- ACOMPAÑAMIENTOS -->
                <a href="/mis-acompanamientos"
                   th:href="@{/mis-acompanamientos}"
                   class="sidebar__link"
                   data-tooltip="Mis acompañamientos"
                   title="Mis acompañamientos"
                   th:classappend="${paginaActiva == 'acompanamientos'} ? ' sidebar__link--active' : ''"
                   th:attr="aria-current=${paginaActiva == 'acompanamientos' ? 'page' : null}">

                    <svg class="sidebar__icon"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         aria-hidden="true">

                        <rect x="3" y="3" width="18" height="18" rx="3"/>
                        <path d="M8 8h8M8 12h8M8 16h5"/>

                    </svg>

                    <span class="sidebar__link-label">Mis acompañamientos</span>

                </a>

                <!-- SER VOLUNTARIO: abre el formulario o el perfil de voluntario. -->
                <a href="/ser-voluntario"
                   th:href="@{/ser-voluntario}"
                   class="sidebar__link"
                   data-tooltip="Ser voluntario"
                   title="Ser voluntario"
                   th:classappend="${paginaActiva == 'ser-voluntario'} ? ' sidebar__link--active' : ''"
                   th:attr="aria-current=${paginaActiva == 'ser-voluntario' ? 'page' : null}">

                    <svg class="sidebar__icon"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="1.8"
                         fill="currentColor"
                         aria-hidden="true">

                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>

                    </svg>

                    <span class="sidebar__link-label">Ser voluntario</span>

                </a>

                </th:block>

                <!-- OPCIONES DEL ADMINISTRADOR: gestión de usuarios, visible solo
                     cuando el rol es Administrador. -->
                <a th:if="${usuarioRol == 'Administrador'}"
                   href="/admin/usuarios"
                   th:href="@{/admin/usuarios}"
                   class="sidebar__link"
                   data-tooltip="Gestión de usuarios"
                   title="Gestión de usuarios"
                   th:classappend="${paginaActiva == 'usuarios'} ? ' sidebar__link--active' : ''"
                   th:attr="aria-current=${paginaActiva == 'usuarios' ? 'page' : null}">

                    <svg class="sidebar__icon"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         aria-hidden="true">

                        <circle cx="9" cy="8" r="3"/>
                        <circle cx="17" cy="9" r="2.5"/>
                        <path d="M3 20v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1M15 14h1a4 4 0 0 1 4 4v2"/>

                    </svg>

                    <span class="sidebar__link-label">Gestión de usuarios</span>

                </a>

                <!-- PERFIL: disponible para todos los roles. -->
                <a href="/perfil"
                   th:href="@{/perfil}"
                   class="sidebar__link"
                   data-tooltip="Mi perfil"
                   title="Mi perfil"
                   th:classappend="${paginaActiva == 'perfil'} ? ' sidebar__link--active' : ''"
                   th:attr="aria-current=${paginaActiva == 'perfil' ? 'page' : null}">

                    <svg class="sidebar__icon"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         aria-hidden="true">

                        <circle cx="12" cy="8" r="4"/>
                        <path d="M5 21c0-4 2.8-7 7-7s7 3 7 7"/>

                    </svg>

                    <span class="sidebar__link-label">Mi perfil</span>

                </a>

            </nav>

            <!-- INFORMACIÓN INSTITUCIONAL: logo de la Universidad Autónoma de
                 Manizales, al final del menú. -->
            <div class="sidebar__decoration">

            <!-- LOGO UAM: se muestra con el menú expandido. -->
            <img src="../../static/img/Logo_UAM.png"
                th:src="@{/img/Logo_UAM.png}"
                alt="Logo de la Universidad Autónoma de Manizales"
                class="sidebar__uam-logo sidebar__uam-logo--expanded">

            <!-- ISOTIPO UAM: se muestra con el menú compacto. -->
            <img src="../../static/img/Isotipo_UAM.jpg"
                th:src="@{/img/Isotipo_UAM.jpg}"
                alt="Isotipo de la Universidad Autónoma de Manizales"
                class="sidebar__uam-logo sidebar__uam-logo--compact">

        </div>

        </aside>

    </th:block>
</body>
</html>
