
<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(titulo, contenido)"
      th:classappend="${clasesAccesibilidad}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${titulo}">Feeling</title>

    <!-- Estilos generales -->
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/interno.css}">

    <!-- Preferencias de accesibilidad del usuario (RF-04): letra grande y alto contraste -->
    <link rel="stylesheet" th:href="@{/css/accesibilidad.css}">

    <!-- Scripts compartidos -->
    <script th:src="@{/js/header.js}" defer></script>
    <script th:src="@{/js/sidebar.js}" defer></script>
</head>

<body>

    <div class="app-shell">

        <!-- Menú lateral -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <!-- Área principal -->
        <div class="app-shell__content">

            <!-- Encabezado -->
            <div th:replace="~{fragments/header :: header}"></div>

            <!-- Contenido de cada página -->
            <main class="main-content">
                <div th:replace="${contenido}">
                    Contenido de la página
                </div>
            </main>

            <!-- Pie de página -->
            <div th:replace="~{fragments/footer :: footer}"></div>

        </div>

    </div>

</body>
</html>
