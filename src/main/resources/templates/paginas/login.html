<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <!--
    PROYECTO: Feeling
    ARCHIVO: login.html
    UBICACIÓN: src/main/resources/templates/paginas/login.html
    MÓDULO: Inicio de sesión (RF-02)

    AUTOR: Yulipaola Domínguez
    VERSIÓN: 1.2.0
    FECHA DE DOCUMENTACIÓN: 2026-11-22
    ESTADO: Finalizado
    TICKET: SCRUM-52

    DESCRIPCIÓN:
    Vista de inicio de sesión de Feeling. Permite que un usuario
    registrado ingrese su nombre de usuario y contraseña para entrar
    a la plataforma.

    FUNCIONALIDADES:
    - Formulario de inicio de sesión (nombre de usuario y contraseña).
    - Validación de campos vacíos en el navegador (login.js).
    - Mensaje de error del servidor cuando las credenciales no son válidas.
    - Estado "Ingresando..." del botón mientras se envía.
    - Enlaces para volver al inicio y para crear una cuenta.

    ESTRUCTURA DE LA PÁGINA:
    - Enlace "Volver al inicio".
    - Cuadro informativo ("Tu bienestar también es parte de tu éxito").
    - Tarjeta con el logo, el formulario y el acceso al registro.
    - Logo de la Universidad Autónoma de Manizales.
    - Pie de página compartido.

    TECNOLOGÍAS:
    - HTML5, Thymeleaf, CSS3 y JavaScript.

    DEPENDENCIAS:
    - /css/global.css, /css/login.css, /css/interno.css
    - /js/login.js
    - fragments/footer

    DATOS DEL MODELO:
    - error: mensaje que envía LoginController cuando las credenciales
      no son correctas.

    RUTAS DE LA APLICACIÓN UTILIZADAS:
    - GET /login: muestra el formulario.
    - POST /login: envía nombreUsuario y contrasena a LoginController.
    - /: página de inicio (enlace "Volver al inicio").
    - /registro: registro de nuevos usuarios.

    HISTORIAL DE VERSIONES:
    - 1.0.0: vista de inicio de sesión según el mockup.
    - 1.1.0: distribución adaptable sin superposición.
    - 1.2.0: enlace para volver al inicio, mensajes de validación por
      campo, estado de carga del botón y documentación.

    OBSERVACIONES:
    La validación de credenciales y el manejo de la sesión los hace
    el backend (LoginController y ServicioAutenticacion).
    -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Inicia sesión en Feeling y accede a tu comunidad de apoyo académico universitario.">

    <meta name="theme-color" content="#087E96">

    <title>Iniciar sesión | Feeling</title>

    <link rel="icon"
          type="image/png"
          th:href="@{/img/favicon-32x32.png}">

    <!-- Variables y estilos generales; luego los de esta vista -->
    <link rel="stylesheet"
          th:href="@{/css/global.css}">

    <link rel="stylesheet"
          th:href="@{/css/login.css}">

    <!-- Estilos del pie de página compartido -->
    <link rel="stylesheet"
          th:href="@{/css/interno.css}">
</head>

<body class="login-page">

    <main class="login-main">

        <!-- Capa decorativa que suaviza la imagen de fondo -->
        <div class="login-main__overlay" aria-hidden="true"></div>

        <!-- Enlace para volver a la página de inicio -->
        <a class="login-volver" th:href="@{/}">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5"/>
                <path d="m12 19-7-7 7-7"/>
            </svg>
            Volver al inicio
        </a>


        <!-- Cuadro informativo -->
        <section class="login-presentation"
                 aria-labelledby="login-presentation-title">

            <div class="login-presentation__content">

                <h1 class="login-presentation__title"
                    id="login-presentation-title">

                    <span>Tu bienestar</span>
                    <span>también es parte</span>
                    <span>de tu éxito.</span>

                </h1>

                <p class="login-presentation__description">
                    En Feeling encontrarás apoyo académico, emocional
                    y una comunidad que te acompaña.
                </p>

            </div>

        </section>


        <!-- Tarjeta de inicio de sesión -->
        <section class="login-form-panel"
                 aria-labelledby="login-form-title">

            <div class="login-form-panel__content">

                <!-- Logo, título y descripción -->
                <header class="login-form-header">

                    <div class="login-form-header__brand">

                        <img src="/img/Logosímbolo_Sin_Fondo.png"
                             th:src="@{/img/Logosímbolo_Sin_Fondo.png}"
                             alt="Feeling, juntos es más fácil">

                    </div>

                    <h2 class="login-form-header__title"
                        id="login-form-title">
                        ¡Bienvenido/a!
                    </h2>

                    <p class="login-form-header__description">
                        Inicia sesión para continuar en la plataforma.
                    </p>

                </header>


                <!-- Formulario: los name deben coincidir con los
                     parámetros de LoginController -->
                <form class="login-form"
                      id="loginForm"
                      th:action="@{/login}"
                      method="post"
                      novalidate>

                    <!-- Error enviado por el servidor (credenciales no válidas) -->
                    <div class="login-form__server-error"
                         id="loginServerError"
                         role="alert"
                         aria-live="assertive"
                         th:if="${error}"
                         th:text="${error}">
                    </div>


                    <!-- Nombre de usuario -->
                    <div class="login-form__group">

                        <label for="nombreUsuario">
                            Nombre de usuario
                        </label>

                        <div class="login-form__control">

                            <svg class="login-form__icon"
                                 xmlns="http://www.w3.org/2000/svg"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="1.8"
                                 stroke-linecap="round"
                                 stroke-linejoin="round"
                                 aria-hidden="true">

                                <circle cx="12" cy="8" r="4"/>
                                <path d="M5 21v-2a7 7 0 0 1 14 0v2"/>

                            </svg>

                            <input type="text"
                                   id="nombreUsuario"
                                   name="nombreUsuario"
                                   placeholder="Ingresa tu nombre de usuario"
                                   autocomplete="username"
                                   maxlength="50"
                                   required
                                   autofocus
                                   aria-describedby="errorNombreUsuario">

                        </div>

                        <small class="login-form__error"
                               id="errorNombreUsuario"
                               aria-live="polite"></small>

                    </div>


                    <!-- Contraseña (los espacios no se recortan) -->
                    <div class="login-form__group">

                        <label for="contrasena">
                            Contraseña
                        </label>

                        <div class="login-form__control">

                            <svg class="login-form__icon"
                                 xmlns="http://www.w3.org/2000/svg"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="1.8"
                                 stroke-linecap="round"
                                 stroke-linejoin="round"
                                 aria-hidden="true">

                                <rect x="3" y="11" width="18" height="11" rx="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>

                            </svg>

                            <input type="password"
                                   id="contrasena"
                                   name="contrasena"
                                   placeholder="Ingresa tu contraseña"
                                   autocomplete="current-password"
                                   maxlength="64"
                                   required
                                   aria-describedby="errorContrasena">

                        </div>

                        <small class="login-form__error"
                               id="errorContrasena"
                               aria-live="polite"></small>

                    </div>


                    <!-- Mensaje general cuando faltan campos -->
                    <p class="login-form__message"
                       id="loginFormMessage"
                       role="alert"
                       aria-live="assertive"></p>


                    <button type="submit"
                            class="login-form__submit"
                            id="loginSubmit">

                        <span id="loginSubmitText">Iniciar sesión</span>
                        <span id="loginLoading" hidden>Ingresando...</span>

                    </button>

                </form>


                <!-- Acceso al registro -->
                <footer class="login-form-footer">

                    <p class="login-form-footer__description">
                        ¿Primera vez en el sistema?
                    </p>

                    <a class="login-form-footer__register"
                       th:href="@{/registro}">
                        ¡Regístrate aquí!
                    </a>

                </footer>

            </div>

        </section>


        <!-- Logo de la Universidad Autónoma de Manizales -->
        <div class="login-university-logo">

            <img src="/img/Logo_UAM.png"
                 th:src="@{/img/Logo_UAM.png}"
                 alt="Universidad Autónoma de Manizales">

        </div>

    </main>

<!-- Pie de página compartido -->
<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<!-- Comportamiento del formulario de inicio de sesión -->
<script th:src="@{/js/login.js}" defer></script>

</body>

</html>
