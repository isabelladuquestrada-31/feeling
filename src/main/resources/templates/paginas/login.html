
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <!--
        PROYECTO: FEELING
        MÓDULO: AUTENTICACIÓN DE USUARIOS
        ARCHIVO: login.html
        VERSIÓN: 1.0.0
        TECNOLOGÍAS: HTML5, Thymeleaf y CSS3

        DESCRIPCIÓN:
        Define la estructura de la vista de inicio de sesión de Feeling.
        Permite que los usuarios registrados ingresen sus credenciales
        para acceder a las funcionalidades de la plataforma.

        FUNCIONALIDADES:
        - Presentación de la identidad visual de Feeling.
        - Formulario para ingresar nombre de usuario y contraseña.
        - Envío de credenciales al controlador de autenticación.
        - Visualización de mensajes de error devueltos por el servidor.
        - Navegación hacia la vista de registro.

        INTEGRACIÓN CON EL BACKEND:
        Controlador: LoginController
        Ruta de visualización: GET /login
        Ruta de autenticación: POST /login
        Parámetros esperados: nombreUsuario y contrasena
        Vista asociada: paginas/login

        DEPENDENCIAS:
        - global.css: variables y estilos generales de la plataforma.
        - login.css: estilos específicos de esta vista.
        - Thymeleaf: resolución de rutas y visualización de datos del servidor.

        RECURSOS GRÁFICOS:
        - Fondo_LogIn.jpg: imagen de fondo de la pantalla.
        - Logosímbolo_Sin_Fondo.png: identidad visual de Feeling.
        - Logo_UAM.png: identidad institucional de la universidad.

        RESPONSABILIDAD:
        Este archivo contiene exclusivamente la estructura y los elementos
        de la interfaz. La validación de credenciales y el control de
        sesiones son responsabilidad del backend.
    -->

    <!-- Configuración del documento y compatibilidad con dispositivos -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Metadatos descriptivos de la página -->
    <meta name="description"
          content="Inicia sesión en Feeling y accede a tu comunidad de apoyo académico universitario.">

    <meta name="theme-color" content="#087E96">

    <!-- Título e icono de la pestaña del navegador -->
    <title>Iniciar sesión | Feeling</title>

    <link rel="icon"
          type="image/png"
          th:href="@{/img/favicon-32x32.png}">

    <!-- Hoja de estilos general: contiene las variables visuales compartidas -->
    <link rel="stylesheet"
          th:href="@{/css/global.css}">

    <!-- Hoja de estilos específica para la pantalla de inicio de sesión -->
    <link rel="stylesheet"
          th:href="@{/css/login.css}">

    
    <link rel="stylesheet"
          th:href="@{/css/interno.css}">
          
</head>

<body class="login-page">

    <!--
        CONTENEDOR PRINCIPAL

        Organiza los dos componentes principales de la pantalla:
        el panel informativo y el panel de autenticación.

        La estructura permite adaptar la distribución mediante CSS
        según el tamaño de pantalla del dispositivo.
    -->
    <main class="login-main">

        <!--
            CAPA DE CONTRASTE

            Se utiliza para mejorar la legibilidad del contenido
            sobre la imagen de fondo sin modificar la imagen original.
            Es un elemento exclusivamente decorativo.
        -->
        <div class="login-main__overlay" aria-hidden="true"></div>


        <!--
            PANEL DE PRESENTACIÓN

            Contiene el mensaje institucional y la descripción
            de los servicios de acompañamiento ofrecidos por Feeling.

            El encabezado principal de esta sección utiliza h1
            para identificar el contenido principal de la página.
        -->
        <section class="login-presentation"
                 aria-labelledby="login-presentation-title">

            <div class="login-presentation__content">

                <h1 class="login-presentation__title"
                    id="login-presentation-title">

                    <span>Tu bienestar</span>
                    <span>también es parte</span>
                    <span>de tu éxito.</span>

                </h1>

                <p class="login-presentation__description">
                    En Feeling encontrarás apoyo académico, emocional
                    y una comunidad que te acompaña.
                </p>

            </div>

        </section>


        <!--
            PANEL DE AUTENTICACIÓN

            Contiene la tarjeta de inicio de sesión y sus elementos.
            El formulario envía las credenciales al controlador
            encargado de verificar la identidad del usuario.
        -->
        <section class="login-form-panel"
                 aria-labelledby="login-form-title">

            <div class="login-form-panel__content">


                <!--
                    ENCABEZADO DEL FORMULARIO

                    Presenta el logotipo de Feeling, el título
                    de bienvenida y una descripción de la acción.
                -->
                <header class="login-form-header">

                    <!-- Logotipo principal de la plataforma -->
                    <div class="login-form-header__brand">

                        <img src="/img/Logosímbolo_Sin_Fondo.png"
                             th:src="@{/img/Logosímbolo_Sin_Fondo.png}"
                             alt="Feeling, juntos es más fácil">

                    </div>

                    <h2 class="login-form-header__title"
                        id="login-form-title">
                        ¡Bienvenido/a!
                    </h2>

                    <p class="login-form-header__description">
                        Inicia sesión para continuar en la plataforma.
                    </p>

                </header>


                <!--
                    FORMULARIO DE INICIO DE SESIÓN

                    Envía las credenciales mediante el método POST
                    al endpoint /login del LoginController.

                    Los atributos name de los campos deben coincidir
                    exactamente con los parámetros recibidos por
                    el método iniciarSesion del controlador.
                -->
                <form class="login-form"
                      id="loginForm"
                      th:action="@{/login}"
                      method="post">


                    <!--
                        MENSAJE DE ERROR DEL SERVIDOR

                        El controlador agrega el atributo "error"
                        cuando las credenciales no son válidas.

                        Thymeleaf comprueba si el atributo existe
                        y muestra su contenido dentro de la tarjeta.

                        El mensaje se anuncia mediante aria-live
                        para facilitar su identificación por lectores
                        de pantalla.
                    -->
                    <div class="login-form__server-error"
                         id="loginServerError"
                         role="alert"
                         aria-live="assertive"
                         th:if="${error}"
                         th:text="${error}">
                    </div>


                    <!--
                        CAMPO DE NOMBRE DE USUARIO

                        Permite ingresar el identificador utilizado
                        por el usuario para autenticarse.

                        name="nombreUsuario" corresponde al parámetro
                        @RequestParam del LoginController.
                    -->
                    <div class="login-form__group">

                        <label for="nombreUsuario">
                            Nombre de usuario
                        </label>

                        <div class="login-form__control">

                            <!-- Icono decorativo del campo -->
                            <svg class="login-form__icon"
                                 xmlns="http://www.w3.org/2000/svg"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="1.8"
                                 stroke-linecap="round"
                                 stroke-linejoin="round"
                                 aria-hidden="true">

                                <circle cx="12" cy="8" r="4"/>
                                <path d="M5 21v-2a7 7 0 0 1 14 0v2"/>

                            </svg>

                            <input type="text"
                                   id="nombreUsuario"
                                   name="nombreUsuario"
                                   placeholder="Ingresa tu nombre de usuario"
                                   autocomplete="username"
                                   maxlength="50"
                                   required
                                   autofocus>

                        </div>

                    </div>


                    <!--
                        CAMPO DE CONTRASEÑA

                        Permite ingresar la contraseña asociada
                        a la cuenta del usuario.

                        El tipo password oculta los caracteres
                        durante su introducción.

                        autocomplete="current-password" indica
                        al navegador que se trata de una contraseña
                        correspondiente a una cuenta existente.

                        name="contrasena" corresponde al parámetro
                        recibido por el LoginController.
                    -->
                    <div class="login-form__group">

                        <label for="contrasena">
                            Contraseña
                        </label>

                        <div class="login-form__control">

                            <!-- Icono decorativo del campo -->
                            <svg class="login-form__icon"
                                 xmlns="http://www.w3.org/2000/svg"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="1.8"
                                 stroke-linecap="round"
                                 stroke-linejoin="round"
                                 aria-hidden="true">

                                <rect x="3" y="11" width="18" height="11" rx="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>

                            </svg>

                            <input type="password"
                                   id="contrasena"
                                   name="contrasena"
                                   placeholder="Ingresa tu contraseña"
                                   autocomplete="current-password"
                                   maxlength="64"
                                   required>

                        </div>

                    </div>


                    <!--
                        BOTÓN DE AUTENTICACIÓN

                        Envía los valores de los campos al servidor
                        para que el servicio de autenticación compruebe
                        las credenciales ingresadas.

                        La respuesta del servidor determina si el usuario
                        accede a la plataforma o permanece en el formulario
                        con un mensaje de error.
                    -->
                    <button type="submit"
                            class="login-form__submit"
                            id="loginSubmit">

                        Iniciar sesión

                    </button>

                </form>


                <!--
                    PIE DE LA TARJETA

                    Proporciona acceso a la creación de una cuenta
                    para los usuarios que todavía no están registrados.

                    La ruta /registro corresponde a la vista de registro
                    gestionada por el controlador correspondiente.
                -->
                <footer class="login-form-footer">

                    <p class="login-form-footer__description">
                        ¿Primera vez en el sistema?
                    </p>

                    <a class="login-form-footer__register"
                       th:href="@{/registro}">
                        ¡Regístrate aquí!
                    </a>

                </footer>

            </div>

        </section>


        <!--
            IDENTIDAD INSTITUCIONAL

            Muestra el logotipo de la Universidad Autónoma de Manizales.
            Su ubicación y dimensiones se controlan desde login.css.
        -->
        <div class="login-university-logo">

            <img src="/img/Logo_UAM.png"
                 th:src="@{/img/Logo_UAM.png}"
                 alt="Universidad Autónoma de Manizales">

        </div>

    </main>
    
<!-- Footer compartido -->

<th:block th:replace="~{fragments/footer :: footer}"></th:block>


<!-- JavaScript exclusivo del registro -->

<script th:src="@{/js/login.js}" defer></script>


</body>

</html>
